<body>

<div class="app-container">
    <header>
        <a href="guvenlik.html" class="back-btn">
            <span class="material-symbols-outlined" style="font-size: 18px;">arrow_back</span>GERİ
        </a>
        <div style="font-weight: 900; font-size: 14px; letter-spacing: 1px;">DEVRİYE-<span style="color:var(--primary)">GEÇMİŞİ</span></div>
    </header>

   <main>
        <!-- Kırmızı Vurgulu Aktif Devriye Banner'ı -->
        <div id="active-devriye-banner" style="display: none; align-items: center; justify-content: space-between; background: rgba(255, 77, 77, 0.12); border: 1px solid #ff4d4d; padding: 10px 14px; border-radius: 20px; margin-bottom: 20px; backdrop-filter: blur(5px); box-shadow: 0 0 15px rgba(255, 77, 77, 0.25);">
            <div style="display: flex; align-items: center; gap: 8px;">
                <span class="live-dot"></span>
                <span id="devriye-banner-text" style="font-size: 11px; font-weight: 800; letter-spacing: 0.5px; color: #ffffff; text-transform: uppercase;">
                    <!-- Dinamik devriye saati buraya gelecek -->
                </span>
            </div>
        </div>

        <div class="date-area">
            <input type="date" id="mainDate" class="date-input">
        </div>
        <div id="patrolLogs"></div>
    </main>
</div>

<div id="noteModal" class="modal">
    <div class="modal-box">
        <span class="material-symbols-outlined" style="color:var(--primary); font-size:48px;">description</span>
        <h3 style="margin: 10px 0; font-size:14px; letter-spacing:1px;">DEVRİYE NOTU</h3>
        <p id="modalNote" style="font-style:italic; color: var(--text-muted); line-height:1.6;"></p>
        <button class="modal-btn" onclick="closeModal()">ANLADIM</button>
    </div>
</div>
